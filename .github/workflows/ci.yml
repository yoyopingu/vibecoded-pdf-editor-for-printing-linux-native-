name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Primary test suite
        run: QT_QPA_PLATFORM=offscreen python tests/run.py

      - name: Pytest + coverage (one process per module — a single pytest process overflows the Qt heap)
        run: |
          set -e
          for f in tests/test_*.py; do
            QT_QPA_PLATFORM=offscreen coverage run -m pytest "$f" -q
          done
          coverage combine
          coverage report --fail-under=0