[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copyshop-pdf-suite"
version = "3.0.0"
description = "PDF viewer, page manager and prepress toolkit for copy shops"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# 3.9 is the real floor: tools/i18n.py:41 annotates a module-level name with
# `dict[str, str]`, and module-level annotations are evaluated at import, so
# PEP 585 builtin generics have to exist. Nothing in the tree needs anything
# newer — the syntax itself parses as far back as 3.7.
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.6",
    "pypdf>=4.0",
    "pikepdf>=8.0",
    "pypdfium2>=4.0",
    "Pillow>=10.0",
    "img2pdf>=0.5",
    "reportlab>=4.0",
    "pdf2image>=1.16",
]

[project.optional-dependencies]
# Run as a command, not imported. See requirements.txt.
ocr = ["ocrmypdf>=15.0"]

[project.scripts]
copyshop-pdf = "tools.app:main"

[tool.setuptools.packages.find]
# tools and every subpackage under it. An explicit list names one package and
# setuptools does not recurse into it, so tools.panels, tools.printing,
# tools.render, tools.shell and tools.viewer were left out of the wheel — it
# says so itself, "Package 'tools.panels' is absent from the `packages`
# configuration ... would be ignored", and whether it ships them anyway varies
# by version.
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Eleven tests return a short string — "510 ms render, cancelled in 10 ms" —
# which tests/run.py prints beside the PASS. pytest reads a non-None return as
# a mistaken `assert`, which is a good default and wrong here.
filterwarnings = ["ignore::pytest.PytestReturnNotNoneWarning"]
