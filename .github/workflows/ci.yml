name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Ubuntu's Ghostscript keeps its CMYK ICC profiles in
      # /usr/share/color/icc/ghostscript/ — outside the paths its own SAFER
      # sandbox permits. The PDF/X export's prologue opens the profile with
      # PostScript `(profile) (r) file`, which then dies with
      # /invalidfileaccess; gs prints only "Unrecoverable error, exit code 1"
      # on stderr (the actual reason goes to stdout, which the tool discards
      # when stderr is non-empty), so every PDF/X test failed as a bare
      # "Ghostscript-Fehler:". The profiles are the distro's own read-only
      # standard files; permitting them is the narrowest fix that does not
      # weaken SAFER for anything else.
      GS_OPTIONS: >-
        --permit-file-read=/usr/share/ghostscript/*
        --permit-file-read=/usr/share/color/icc/ghostscript/*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ghostscript libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Primary test suite
        run: QT_QPA_PLATFORM=offscreen python tests/run.py

      - name: Pytest + coverage (one process per module — a single pytest process overflows the Qt heap)
        run: |
          set -e
          for f in tests/test_*.py; do
            QT_QPA_PLATFORM=offscreen coverage run -m pytest "$f" -q
          done
          coverage combine
          coverage report --fail-under=0