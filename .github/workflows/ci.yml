name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # The PDF/X prologue opens the CMYK profile with PostScript
      # `(path) (r) file`, which goes through gs's default SAFER sandbox:
      # reads are permitted only inside gs's own search paths. Ubuntu/Debian
      # ship the profile in /usr/share/color/icc/ghostscript/ (libgs-common),
      # outside that sandbox — the open dies with /invalidfileaccess and gs
      # prints only "Unrecoverable error, exit code 1" on stderr (the real
      # PostScript error goes to stdout, which the tool discards when stderr
      # is non-empty). _export_pdfx now grants the profile directory in its
      # own argv (_safer_permit_flag); this env var covers the one spot that
      # builds its gs command by hand (tests/test_gs_pool.py) plus anything
      # else that embeds a profile without a grant. It demonstrably works on
      # noble's gs 10.02.1: with it, 7 of the 10 PDF/X tests recovered.
      GS_OPTIONS: >-
        --permit-file-read=/usr/share/ghostscript/*
        --permit-file-read=/usr/share/color/icc/ghostscript/*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ghostscript libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # noble's gs 10.02.1 declares the PDFX device parameter as bool, so
      # `-dPDFX=4` (the PDF/X-4 export, which keeps transparency live) fails
      # the bool param read and dies the same bare "Unrecoverable error,
      # exit code 1" death — verified in the 10.02.1 sources: gdevpdfp.c
      # declares gs_param_type_bool where 10.07.1 declares gs_param_type_int
      # and branches on `PDFX > 0 && PDFX < 4`. noble-backports has no
      # ghostscript at all, so CI builds the exact version the suite is
      # developed against (10.07.1). /usr/local/bin precedes /usr/bin in
      # PATH, the apt package stays as a fallback, and the assertion below
      # turns a silently broken install into an immediate, legible failure.
      - name: Build Ghostscript 10.07.1 (noble's 10.02.1 cannot write PDF/X-4)
        run: |
          set -e
          curl -sSfL -o /tmp/gs.tar.gz \
            https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/ghostscript-10.07.1.tar.gz
          tar -xzf /tmp/gs.tar.gz -C /tmp
          cd /tmp/ghostscript-10.07.1
          ./configure --prefix=/usr/local \
            --without-x --disable-cups --disable-gtk --without-tesseract \
            >/tmp/gs-configure.log 2>&1 || { cat /tmp/gs-configure.log; exit 1; }
          make -j"$(nproc)" >/tmp/gs-make.log 2>&1 || { tail -100 /tmp/gs-make.log; exit 1; }
          sudo make install >/tmp/gs-install.log 2>&1 || { tail -50 /tmp/gs-install.log; exit 1; }
          test "$(gs --version)" = "10.07.1" || { echo "gs --version: $(gs --version)"; exit 1; }
          echo "Ghostscript $(gs --version) ready"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Primary test suite
        run: QT_QPA_PLATFORM=offscreen python tests/run.py

      - name: Pytest + coverage (one process per module — a single pytest process overflows the Qt heap)
        run: |
          set -e
          for f in tests/test_*.py; do
            QT_QPA_PLATFORM=offscreen coverage run -m pytest "$f" -q
          done
          coverage combine
          coverage report --fail-under=0